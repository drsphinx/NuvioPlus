name: Build IPA

run-name: Build IPA - ${{ inputs.description }}

on:
  workflow_dispatch:
    inputs:
      description:
        description: Run description
        required: true
        type: string
        default: NuvioPlus SideStore release

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build NuvioPlus for iOS
    runs-on: macos-15-intel
    outputs:
      ipa_name: ${{ steps.package.outputs.ipa_name }}
      app_version: ${{ steps.package.outputs.app_version }}
      build_version: ${{ steps.package.outputs.build_version }}
      bundle_id: ${{ steps.package.outputs.bundle_id }}
      min_os: ${{ steps.package.outputs.min_os }}
    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Fetch iOS Specific Submodule
        run: git submodule update --init --recursive MPVKit

      - name: Patch MPVKit Package.swift for CI (replace local path targets with remote URLs)
        run: |
          cd MPVKit
          python3 - << 'PYEOF'
          import re

          replacements = {
              "Libplacebo": (
                  "https://github.com/mpvkit/libplacebo-build/releases/download/7.360.1/Libplacebo.xcframework.zip",
                  "2fa3d54cb81f302d6f11c7b2f509af30944381c3b11ee9d35096eb4637a6e2dd"
              ),
              "Libavcodec": (
                  "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libavcodec.xcframework.zip",
                  "136e432919a8a7b5b80155c68e9dc91b0ef3ae6623970b87bb8bd96a452543cf"
              ),
              "Libavdevice": (
                  "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libavdevice.xcframework.zip",
                  "65713615f53352b37baffb38c5b88d88bab647d050d999bcc4684344ab636bdf"
              ),
              "Libavformat": (
                  "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libavformat.xcframework.zip",
                  "2afb601375929640e743e7bdaa6c4a88e2b582a07e1c5f2dc95cc7f5b26a0810"
              ),
              "Libavfilter": (
                  "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libavfilter.xcframework.zip",
                  "3e71af8633d99d365f14b88064bceafd57acb23fc64db90e55b715a9c0dca328"
              ),
              "Libavutil": (
                  "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libavutil.xcframework.zip",
                  "5dc251c8807c501982edfb0bc9bddfee4148733142d6ebb947738c60fb3bf8d8"
              ),
              "Libswresample": (
                  "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libswresample.xcframework.zip",
                  "d5c36acf2ff944e15706f4b7bfbf18bb1993ffc5b446c9f67f1aa79de5441f15"
              ),
              "Libswscale": (
                  "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libswscale.xcframework.zip",
                  "4fc00de6a7a8cddcdfe0eeb73b4f919cfaf9a0fd5a442f42a43e0f56e157d7c5"
              ),
              "Libmpv": (
                  "https://github.com/mpvkit/MPVKit/releases/download/1.0.0/Libmpv.xcframework.zip",
                  "c381ceb4c1504efac12da95293e56585bbeb691634aa64e3a729f517169933ba"
              ),
          }

          with open("Package.swift", "r") as f:
              content = f.read()

          for name, (url, checksum) in replacements.items():
              # Match binaryTarget with path: for this exact name
              pattern = (
                  r'(\.binaryTarget\(\s*\n\s*name:\s*"' + re.escape(name) + r'",\s*\n)'
                  r'\s*path:\s*"[^"]+"\s*\n'
                  r'(\s*\))'
              )
              replacement = (
                  r'\g<1>'
                  f'            url: "{url}",\n'
                  f'            checksum: "{checksum}"\n'
                  r'\g<2>'
              )
              new_content, count = re.subn(pattern, replacement, content)
              if count:
                  print(f"✓ Patched {name}")
                  content = new_content
              else:
                  print(f"  (skipped {name} — already url-based or not found)")

          with open("Package.swift", "w") as f:
              f.write(content)

          print("\nDone.")
          PYEOF

      - name: Select Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Nuvio Engine Apple XCFramework
        env:
          NUVIO_ENGINE_VERSION: 0.1.1
        run: |
          set -euo pipefail

          ENGINE_ROOT="../nuvio-engine/platform/apple"
          ENGINE_DEST="${ENGINE_ROOT}/NuvioEngine.xcframework"
          ARCHIVE="${RUNNER_TEMP}/nuvio-engine-apple-${NUVIO_ENGINE_VERSION}.zip"
          EXTRACT_DIR="${RUNNER_TEMP}/nuvio-engine-apple-${NUVIO_ENGINE_VERSION}"

          rm -rf "${ENGINE_ROOT}" "${EXTRACT_DIR}" "${ARCHIVE}"
          mkdir -p "${ENGINE_ROOT}" "${EXTRACT_DIR}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            "https://github.com/NuvioMedia/nuvio-engine/releases/download/v${NUVIO_ENGINE_VERSION}/nuvio-engine-apple-${NUVIO_ENGINE_VERSION}.zip" \
            --output "${ARCHIVE}"

          ditto -x -k "${ARCHIVE}" "${EXTRACT_DIR}"

          XCFRAMEWORK="$(find "${EXTRACT_DIR}" -type d -name NuvioEngine.xcframework -print -quit)"
          if [[ -z "${XCFRAMEWORK}" ]]; then
            echo "::error::NuvioEngine.xcframework was not found in the downloaded archive."
            find "${EXTRACT_DIR}" -maxdepth 4 -print
            exit 1
          fi

          ditto "${XCFRAMEWORK}" "${ENGINE_DEST}"

          for SLICE in ios-arm64 ios-arm64_x86_64-simulator; do
            SLICE_DIR="${ENGINE_DEST}/${SLICE}"

            test -f "${SLICE_DIR}/libCNuvioEngine.a" || {
              echo "::error::Missing ${SLICE_DIR}/libCNuvioEngine.a"
              exit 1
            }

            test -f "${SLICE_DIR}/Headers/nuvio_engine/nuvio_engine.h" || {
              echo "::error::Missing ${SLICE_DIR}/Headers/nuvio_engine/nuvio_engine.h"
              exit 1
            }
          done

          echo "Nuvio Engine Apple XCFramework installed at ${ENGINE_DEST}"
          find "${ENGINE_DEST}" -maxdepth 4 -type f -print

      - name: Generate local.properties
        run: |
          cat << 'EOF' > local.properties
          NUVIO_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI=${{ secrets.TRAKT_REDIRECT_URI }}
          SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET=${{ secrets.SIMKL_CLIENT_SECRET }}
          SIMKL_REDIRECT_URI=${{ secrets.SIMKL_REDIRECT_URI }}
          PREMIUMIZE_CLIENT_ID=${{ secrets.PREMIUMIZE_CLIENT_ID }}
          PREMIUMIZE_CLIENT_SECRET=${{ secrets.PREMIUMIZE_CLIENT_SECRET }}
          PREMIUMIZE_REDIRECT_URI=${{ secrets.PREMIUMIZE_REDIRECT_URI }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}
          CONTRIBUTIONS_URL=${{ secrets.CONTRIBUTIONS_URL }}
          DONATIONS_BASE_URL=${{ secrets.DONATIONS_BASE_URL }}
          DONATIONS_DONATE_URL=${{ secrets.DONATIONS_DONATE_URL }}
          DIRECT_DEBRID_API_BASE_URL=${{ secrets.DIRECT_DEBRID_API_BASE_URL }}
          NUVIO_IOS_DISTRIBUTION=full
          EOF

      - name: Restore iOS build caches
        id: ios-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
            ~/Library/Caches/org.swift.swiftpm
            iosApp/build/SourcePackages
          key: ${{ runner.os }}-ios-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'MPVKit/Package.swift', 'iosApp/iosApp.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-ios-

      - name: Build iOS App via Xcode
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Save iOS build caches
        if: always() && steps.ios-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
            ~/Library/Caches/org.swift.swiftpm
            iosApp/build/SourcePackages
          key: ${{ steps.ios-cache.outputs.cache-primary-key }}

      - name: Package App into .ipa
        id: package
        run: |
          set -euo pipefail
          cd iosApp/build/Build/Products/Release-iphoneos
          APP_DIR=$(ls -d *.app | head -n 1)
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_DIR/Info.plist")
          BUILD_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP_DIR/Info.plist")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_DIR/Info.plist")
          MIN_OS=$(/usr/libexec/PlistBuddy -c "Print MinimumOSVersion" "$APP_DIR/Info.plist" 2>/dev/null || echo "16.0")
          mkdir -p Payload
          rm -rf Payload/*
          cp -R "$APP_DIR" Payload/
          IPA_NAME="NuvioPlus-v${APP_VERSION}.ipa"
          zip -q -r "$IPA_NAME" Payload
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "min_os=$MIN_OS" >> "$GITHUB_OUTPUT"
          echo "Packaged $IPA_NAME ($BUNDLE_ID $APP_VERSION/$BUILD_VERSION)"

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioPlus-iOS
          path: iosApp/build/Build/Products/Release-iphoneos/${{ steps.package.outputs.ipa_name }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release + SideStore JSON
    needs: build-ipa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cmp-rewrite
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: NuvioPlus-iOS
          path: release-assets

      - name: Create or update GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.build-ipa.outputs.app_version }}
          BUILD_VERSION: ${{ needs.build-ipa.outputs.build_version }}
          IPA_NAME: ${{ needs.build-ipa.outputs.ipa_name }}
        run: |
          set -euo pipefail
          TAG="nuvioplus-${APP_VERSION}-b${BUILD_VERSION}"
          TITLE="NuvioPlus ${APP_VERSION} (${BUILD_VERSION})"
          NOTES="$(cat <<EOF
          NuvioPlus unsigned IPA for SideStore / AltStore.

          Includes Ambient Hero Backdrop (Settings → Appearance → Display).

          SideStore source:
          https://raw.githubusercontent.com/drsphinx/NuvioPlus/cmp-rewrite/apps.json
          EOF
          )"
          NOTES=$(sed 's/^          //' <<<"$NOTES")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "release-assets/${IPA_NAME}" --clobber
          else
            gh release create "$TAG" "release-assets/${IPA_NAME}" --title "$TITLE" --notes "$NOTES"
          fi
          IPA_URL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq ".assets[] | select(.name==\"${IPA_NAME}\") | .browser_download_url")
          SIZE=$(stat -c%s "release-assets/${IPA_NAME}")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ipa_url=$IPA_URL" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "Published $TAG -> $IPA_URL ($SIZE bytes)"

      - name: Update SideStore apps.json
        env:
          APP_VERSION: ${{ needs.build-ipa.outputs.app_version }}
          BUILD_VERSION: ${{ needs.build-ipa.outputs.build_version }}
          BUNDLE_ID: ${{ needs.build-ipa.outputs.bundle_id }}
          MIN_OS: ${{ needs.build-ipa.outputs.min_os }}
          IPA_URL: ${{ steps.release.outputs.ipa_url }}
          IPA_SIZE: ${{ steps.release.outputs.size }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("apps.json")
          source = json.loads(path.read_text())
          app = source["apps"][0]
          version = os.environ["APP_VERSION"]
          build = os.environ["BUILD_VERSION"]
          url = os.environ["IPA_URL"]
          size = int(os.environ["IPA_SIZE"])
          min_os = os.environ.get("MIN_OS") or "16.0"
          date = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          notes = f"NuvioPlus {version} ({build}) — Ambient Hero Backdrop + upstream."

          entry = {
              "version": version,
              "buildVersion": build,
              "date": date,
              "localizedDescription": notes,
              "downloadURL": url,
              "size": size,
              "minOSVersion": min_os,
          }
          history = [
              v for v in (app.get("versions") or [])
              if not (v.get("version") == version and v.get("buildVersion") == build)
          ]
          app["versions"] = [entry] + history[:20]
          # SideStore compatibility: top-level downloadURL required
          app["version"] = version
          app["versionDate"] = date
          app["versionDescription"] = notes
          app["downloadURL"] = url
          app["size"] = size
          if os.environ.get("BUNDLE_ID"):
              app["bundleIdentifier"] = os.environ["BUNDLE_ID"]
          path.write_text(json.dumps(source, indent=2) + "\n")
          print(f"Updated apps.json -> {url}")
          PY

      - name: Commit apps.json
        run: |
          set -euo pipefail
          if git diff --quiet -- apps.json; then
            echo "apps.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "chore: update SideStore apps.json for ${{ steps.release.outputs.tag }}"
          git pull --rebase origin cmp-rewrite
          git push origin HEAD:cmp-rewrite
